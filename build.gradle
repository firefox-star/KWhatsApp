// Top-level build file.
// MODERNIZED 2026: the original toolchain (Gradle 2.14.1 / AGP 2.2.3 / jcenter
// / 32-bit build-tools 25) is no longer downloadable or runnable on current
// machines. This project now builds with AGP 8.5.2 + Gradle 8.13 + JDK 17/21.
// The mod output is unchanged: compile, then decompile the APK and merge the
// smali/resources into the WhatsApp base (see README / tools/AiMod/README.md).

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
